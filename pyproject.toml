[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "automatu"
version = "0.1.0"
description = "AutomatU - brings a project's sources together and aligns its code under the plan that explains it"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "numpy>=2.0",
    "fastapi>=0.115",
    "pydantic>=2.7",
    "mcp>=2.3",
    "langgraph>=1.2",
    "langgraph-checkpoint-postgres>=3.2",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
automatu = "automatu.cli:main"

[tool.setuptools]
packages = ["automatu", "automatu.sources"]

[tool.setuptools.package-data]
automatu = ["gitx_bridge.mjs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
