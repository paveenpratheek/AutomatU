<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AutomatU</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app">
    <nav class="side" aria-label="AutomatU">
      <div class="brand">
        <svg width="22" height="20" viewBox="0 0 22 20" aria-hidden="true"><path d="M5.75 1h10.5L21 10l-4.75 9H5.75L1 10Z" fill="currentColor"></path></svg>
        <span class="name">AutomatU</span>
      </div>
      <div id="tabs" class="tabs" role="tablist" aria-label="View" aria-orientation="vertical"></div>
      <div id="sidelist" class="sidelist"></div>
      <div class="sidefoot">
        <div id="kdup" class="kdup" hidden></div>
        <button type="button" id="bellbtn" class="sbtn bell" data-drop="bell" aria-expanded="false" aria-controls="drop" title="Boxes the code has moved past">
          <span class="lb"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16"><path d="M4 11V7.2a4 4 0 0 1 8 0V11l1.2 1.3H2.8Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"></path><path d="M6.6 14h2.8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"></path></svg>Notices</span>
          <span id="bellcount" class="badge" hidden></span>
        </button>
        <button type="button" id="agentsbtn" class="sbtn" data-drop="agents" aria-expanded="false" aria-controls="drop" title="The agents and the repositories they answer for">
          <span class="lb"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="5.5" r="2.6" fill="none" stroke="currentColor" stroke-width="1.3"></circle><path d="M3 13.5c.8-2.6 2.8-3.8 5-3.8s4.2 1.2 5 3.8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"></path></svg>Agents</span>
        </button>
      </div>
    </nav>
    <div class="col">
      <header class="head">
        <div class="headl">
          <nav id="crumbs" class="crumbs" aria-label="Where you are"></nav>
          <h1 id="title" class="pagetitle"></h1>
        </div>
        <div id="headr" class="headr"></div>
      </header>
      <div id="kwf" class="kwf" role="group" aria-label="Keyword filter: click a colour to show or hide it" hidden></div>
      <div class="body">
        <main id="stage" class="stage"></main>
        <aside id="panel" class="panel" aria-label="What this hexagon holds"></aside>
      </div>
      <div id="searchbar" class="searchbar">
        <label class="field">
          <span class="vh">Search the map</span>
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
          <input id="term" type="search" autocomplete="off" placeholder="Search the map: keywords; separated; by semicolons">
        </label>
        <div id="chips" class="chips"></div>
      </div>
    </div>
    <div id="drop" class="drop" role="region" aria-live="polite" hidden></div>
  </div>
  <div id="tip" class="tip" role="tooltip" hidden></div>
  <div id="talk" class="talk" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
