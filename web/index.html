<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AutomatU Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand"><span class="name">AutomatU</span><span class="sub">canvases bound to a repository</span></div>
      <div class="search">
        <label for="term">Traffic for</label>
        <div class="field">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
          <input id="term" type="search" autocomplete="off" placeholder="Keywords split by ; e.g. canvas; alignment">
        </div>
        <div id="chips" class="chips"></div>
      </div>
      <button type="button" class="pill beneath" disabled title="Links beneath the map come after the demo">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 3 8l9 5 9-5-9-5z"></path><path d="m3 16 9 5 9-5"></path></svg>
        Show beneath the map
      </button>
    </header>
    <div class="strip">
      <div id="tabs" class="tabs" role="tablist" aria-label="View"></div>
      <span class="sep" aria-hidden="true"></span>
      <nav id="crumbs" class="crumbs" aria-label="Where you are"></nav>
      <div id="kwf" class="kwf" role="group" aria-label="Keyword filter: click a colour to show or hide it" hidden></div>
    </div>
    <div class="body">
      <main id="stage" class="stage"></main>
      <aside id="panel" class="panel" aria-label="What this hexagon holds"></aside>
    </div>
  </div>
  <div id="tip" class="tip" role="tooltip" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
